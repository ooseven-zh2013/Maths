name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # mcpp-bin 的 wheel 覆盖 Linux x86_64/aarch64、macOS arm64 与 Windows x86_64，
      # 装上后 mcpp 直接进 PATH，比各平台各自的安装脚本省事也更稳。
      - name: Install mcpp
        run: pip install --upgrade mcpp-bin

      - name: mcpp version
        run: mcpp self version

      # -v：模块扫描阶段的问题（哪个文件提供哪个模块）只有 verbose 才看得到
      - name: Build
        run: mcpp build -v

      - name: Run tests
        run: mcpp test

  # Linux / macOS 跑 sh 版，Windows 跑 ps1 版，两边做完的事必须一致：
  # 产物进 releases/<程序名>/，pack 的暂存区 target/dist 清掉，构建缓存留着。
  packaging:
    name: packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mcpp
        run: pip install --upgrade mcpp-bin

      - name: 打包（Linux / macOS）
        if: runner.os != 'Windows'
        run: sh scripts/pack-releases.sh

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\pack-releases.ps1

      - name: 校验产物
        shell: bash
        run: |
          set -e
          echo "--- releases/simplify ---"
          ls -1 releases/simplify

          if [ -f "releases/simplify/simplify.exe" ]; then
            exe="releases/simplify/simplify.exe"
          else
            exe="releases/simplify/simplify"
          fi
          test -x "$exe" || { echo "产物不可执行: $exe"; exit 1; }

          # pack 的暂存区必须被清掉（产物已经复制到 releases，留着就是重复）
          if [ -e target/dist ]; then
            echo "FAIL: target/dist 还在，脚本没清理"
            exit 1
          fi
          echo "ok: target/dist 已清理"

          # 构建缓存要留着，删了下次就是全量重编
          test -d target || { echo "FAIL: target/ 构建缓存被误删"; exit 1; }
          echo "ok: target/ 构建缓存保留"

          echo "--- 跑一遍产物 ---"
          printf '2x + 3x\nx = 5\n0=0\n' | "$exe" | tee /tmp/out.txt
          grep -q '化简结果: 25' /tmp/out.txt || { echo "FAIL: 产物输出不对"; exit 1; }
          echo "ok: 产物运行正常"

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本需与本地开发环境一致，否则同一份代码会得出不同结论
      - name: Install clang-format
        run: pip install "clang-format==23.1.1"

      - name: Check formatting
        run: |
          files=$(find src tests apps -type f \( -name '*.cppm' -o -name '*.cpp' -o -name '*.hpp' \))
          clang-format --dry-run --Werror $files

# 静态检查只有一层：构建时的编译器告警（见 mcpp.toml 的 -Wall -Wextra -Wpedantic -Wshadow）。
#
# **clang-tidy 的 job 加过，2026-10-05 又撤掉了** —— 试出来的结论记在这，免得再试一遍：
#
#   PyPI 的 `clang-tidy` wheel 里那个 clang **不是从 git 检出构建的官方版，没嵌 VCS 分支信息**。
#   而 mcpp 的真 clang 20.1.7 编出的 BMI 头部记着 commit hash，clang 读模块文件时会比对
#   「built from a different branch」—— 编译器那半边是空的，于是**每个文件都报**
#     module file '.../std.pcm' built from a different branch (…) than the compiler ()
#   31 个文件 31 个「有问题」，全是假的。
#
# 这与版本对齐无关（20.1.0 对 20.1.7 已经同 major.minor），是**构建来源**的差别。
# 本机 Windows 上却能正常读 —— 同一份 wheel，所以这大概是平台差异而非运气，
# 但反正 CI（Linux）上这条路过不去。
#
# 所以静态检查靠两层：
#   - 构建时的 -Wall -Wextra -Wpedantic -Wshadow：每次构建都在跑，挡住低级错误
#   - 本地 `sh scripts/run-tidy.sh`：能跑（读得了 BMI），比 CI 严得多。
#     它抓过一个真 UB —— `1 << (index - 1)` 里 `index == 0` 的判断写在移位之后，
#     size_t 回绕成 SIZE_MAX，那是未定义行为，bugprone/performance 都没报，只有
#     clang-analyzer-core.BitwiseShift 报了。`.clang-tidy` 里现在开着 clang-analyzer-*。
#
# 要在 CI 上恢复 tidy，得先有一个**从 git 检出构建**的 clang-tidy 20.1.x 可用。
