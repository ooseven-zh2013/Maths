name: CI

on:
  push:
  pull_request:

# mcppls 的 job 要往 GitHub 代码扫描传 SARIF，需要这个权限。
# 只给这一个 job（写在 job 里而不是顶层），别的 job 仍然是默认的最小权限。
permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # mcpp-bin 的 wheel 覆盖 Linux x86_64/aarch64、macOS arm64 与 Windows x86_64，
      # 装上后 mcpp 直接进 PATH，比各平台各自的安装脚本省事也更稳。
      - name: Install mcpp
        run: pip install --upgrade mcpp-bin

      - name: mcpp version
        run: mcpp self version

      # -v：模块扫描阶段的问题（哪个文件提供哪个模块）只有 verbose 才看得到
      - name: Build
        run: mcpp build -v

      - name: Run tests
        run: mcpp test

  # Linux / macOS 跑 sh 版，Windows 跑 ps1 版，两边做完的事必须一致：
  # 产物进 releases/<程序名>/，pack 的暂存区 target/dist 清掉，构建缓存留着。
  packaging:
    name: packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mcpp
        run: pip install --upgrade mcpp-bin

      - name: 打包（Linux / macOS）
        if: runner.os != 'Windows'
        run: sh scripts/pack-releases.sh

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\pack-releases.ps1

      - name: 校验产物
        shell: bash
        run: |
          set -e
          echo "--- releases/simplify ---"
          ls -1 releases/simplify

          if [ -f "releases/simplify/simplify.exe" ]; then
            exe="releases/simplify/simplify.exe"
          else
            exe="releases/simplify/simplify"
          fi
          test -x "$exe" || { echo "产物不可执行: $exe"; exit 1; }

          # pack 的暂存区必须被清掉（产物已经复制到 releases，留着就是重复）
          if [ -e target/dist ]; then
            echo "FAIL: target/dist 还在，脚本没清理"
            exit 1
          fi
          echo "ok: target/dist 已清理"

          # 构建缓存要留着，删了下次就是全量重编
          test -d target || { echo "FAIL: target/ 构建缓存被误删"; exit 1; }
          echo "ok: target/ 构建缓存保留"

          echo "--- 跑一遍产物 ---"
          printf '2x + 3x\nx = 5\n0=0\n' | "$exe" | tee /tmp/out.txt
          grep -q '化简结果: 25' /tmp/out.txt || { echo "FAIL: 产物输出不对"; exit 1; }
          echo "ok: 产物运行正常"

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本需与本地开发环境一致，否则同一份代码会得出不同结论
      - name: Install clang-format
        run: pip install "clang-format==23.1.1"

      - name: Check formatting
        run: |
          files=$(find src tests apps -type f \( -name '*.cppm' -o -name '*.cpp' -o -name '*.hpp' \))
          clang-format --dry-run --Werror $files

  # 静态检查（clang-tidy）。
  #
  # ⚠️ 这里踩过两个坑，都别再改回去：
  #
  # 1. **不能用 PyPI 的 `clang-tidy` wheel。** 它不是从 git 检出构建的官方版，
  #    内部 clang 的 VCS 分支信息是**空的**（包 `data/bin/` 下也只有 clang-tidy.exe，
  #    没有配套 clang）。mcpp 的 clang 编出的 BMI 头部记着 commit hash，
  #    读模块文件时要比对分支 ⇒ 每个文件都报
  #      module file '…/std.pcm' built from a different branch (…) than the compiler ()
  #    31 个文件 31 个「有问题」，**全是假的**。与版本对齐无关（20.1.0 对 20.1.7 已同 major.minor）。
  #
  # 2. **不能在 ubuntu 上找官方包。** llvmorg-20.1.7 的 GitHub release 里
  #    **没有 x86_64 Linux 预编译包**（只有 armv7a），releases.llvm.org 上也没有。
  #    有的是 `x86_64-pc-windows-msvc` —— 所以这个 job 跑在 **windows-latest** 上。
  #
  # 失败时长这样：满屏 `built from a different branch` ⇒ 来源/版本又不对了，**别去改代码**。
  # mcppls —— C++ 模块语言服务器。**clang-tidy 的补充，不是替代**（tidy 明确保留）。
  #
  # 为什么两个都要：职责不重叠。
  #   clang-tidy  → 代码质量规则（performance-*、readability-* …），它对模块一无所知
  #   mcppls      → **模块级**语义：模块图、跨 import 的引用与调用、一个改动的影响面
  # 后者 clang-tidy 看不见（它不建模块图）；前者 mcppls 也不做（它不带 tidy 那套规则）。
  #
  # ⚠️ **它用哪个 clang**：跑 `mcpp emit build-database` 问 mcpp，所以用的是
  #    mcpp.toml 里声明的 `llvm@20.1.7` —— 与本机编辑器一致，这正是接它进 CI 的目的。
  #    payload 里自带的那份 clangd 23.1.0 只是「机器上没有任何编译器」时的兜底，
  #    有 mcpp 工具链就轮不到它。
  #
  # ⚠️ **先 continue-on-error**：v0.0.16 是 pre-1.0 的单人项目，误报率未知。
  #    让它先把发现报到代码扫描里（Security 页可见），等我们摸清了再去掉这个开关。
  #    去掉的那天也就是「mcppls 也当门」的那天，届时记得同步更新本注释。
  mcppls:
    name: mcppls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      security-events: write     # 只为传 SARIF；contents 已读
    strategy:
      fail-fast: false
      matrix:
        # 三平台都跑：mcppls 的卖点就是「跨编译器一致的模块语义」，
        # 只在 Windows 上验等于没验它跨平台那部分。
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # review 要跟 base 比，浅克隆会拿不到 base 那个 commit
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mcpp
        run: pip install --upgrade mcpp-bin

      # 按平台取 payload。⚠️ macOS runner（macos-latest = macos-14）是 arm64，
      # 不是 x64 —— 取错包的症状是「binary not found」而不是报错信息不好懂。
      - name: Fetch mcppls payload
        shell: bash
        run: |
          set -e
          case "${{ matrix.os }}" in
            windows-latest) asset=payload-win32-x64.tar.gz ;;
            ubuntu-latest)  asset=payload-linux-x64.tar.gz ;;
            macos-latest)   asset=payload-darwin-arm64.tar.gz ;;
            *) echo "没覆盖的平台: ${{ matrix.os }}" >&2; exit 1 ;;
          esac
          url=https://github.com/Sunrisepeak/mcpp-language-server/releases/download/v0.0.16/$asset
          mkdir -p mcppls-tmp
          curl -fsSL --retry 3 "$url" -o mcppls-tmp/payload.tar.gz
          tar -xzf mcppls-tmp/payload.tar.gz -C mcppls-tmp --strip-components=1
          # 二进制名：Windows 带 .exe，别处不带
          if [ -x ./mcppls-tmp/bin/mcppls.exe ]; then bin=mcppls.exe; else bin=mcppls; fi
          ./mcppls-tmp/bin/$bin version
          # 给后面几步用。必须是 POSIX 路径（mcppls 拿它做可执行判断）
          echo "MCPPLS=$(pwd)/mcppls-tmp/bin/$bin" >> "$GITHUB_ENV"

      # BMI 由 mcpp 的 clang 编，所以必须先 build。目标必须与 review 同一平台。
      - name: Build
        run: mcpp build

      # 工具链识别对不对，先打出来 —— 这一行是「CI 与本地是否一致」的直接证据。
      # 本机编辑器状态栏显示的就是它；对不上就说明 mcppls 没读到 mcpp.toml。
      # ⚠️ **不要写成 `mcppls model | head -20`**：head 提前关掉管道，mcppls 下一次
      #    写就撞 EPIPE，而它不处理这个异常 ⇒ `libc++abi: terminating ...
      #    failed to write formatted output: Operation not permitted` + abort。
      #    本地输出小、赶在 head 退出前写完了所以看不出问题，CI 上时序一抖就挂
      #    （2026-10-18 三个平台全是这么挂的）。先落文件，再对文件做 head。
      - name: Show detected toolchain
        shell: bash
        run: |
          '"$MCPPLS"' model > model.json 2>&1 || true
          head -20 model.json

      - name: Review (SARIF)
        shell: bash
        run: |
          set -e
          # --base HEAD~1：push 到 main 时看的是上一个 commit 以来的变化。
          # PR 上 github.event.pull_request.base.sha 更准，但两者取值一样能用，
          # 先不为此加分支逻辑。
          '"$MCPPLS"' review --base HEAD~1 --format sarif --output mcppls.sarif
          # 没发现也要有个合法的空 SARIF，否则上传步骤会失败
          test -s mcppls.sarif || echo '{"version":"2.1.0","runs":[]}' > mcppls.sarif
          echo "发现条数: $(grep -c '"ruleId"' mcppls.sarif || true)"

      - name: Upload SARIF
        # category 按平台分开：三个 matrix job 传同一个 commit，
        # 同一个 category 会互相覆盖，代码扫描里就只剩一个平台的结果。
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mcppls.sarif
          category: mcppls-${{ matrix.os }}
  tidy:
    name: clang-tidy
    runs-on: windows-latest
    timeout-minutes: 60          # 28 个模块文件 × 约 1 分钟
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mcpp
        run: pip install --upgrade mcpp-bin

      # 官方发布包：从 llvmorg-20.1.7 这个 tag 的 git 检出构建 ⇒ 分支信息与 mcpp 的 clang 一致
      #
      # ⚠️ 路径**必须用相对路径或 $(pwd)**，不能直接用 $RUNNER_TEMP：
      #    Windows 上它是 `D://a//_temp` 这种反斜杠盘符路径，Git Bash 的 tar 会把 `D:`
      #    当成**远端主机名** → `tar: Cannot connect to D: resolve failed`（踩过）。
      - name: Fetch LLVM 20.1.7 release
        shell: bash
        run: |
          set -e
          url=https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.7/clang+llvm-20.1.7-x86_64-pc-windows-msvc.tar.xz
          mkdir -p llvm-tmp
          curl -fsSL "$url" -o llvm-tmp/llvm.tar.xz
          tar -xf llvm-tmp/llvm.tar.xz -C llvm-tmp --strip-components=1
          ./llvm-tmp/bin/clang-tidy.exe --version | head -2
          # 给下一步的 CLANG_TIDY 也得是 POSIX 路径（run-tidy.sh 拿它做 `[ -x ]` 测）
          echo "CLANG_TIDY=$(pwd)/llvm-tmp/bin/clang-tidy.exe" >> "$GITHUB_ENV"

      # BMI 由 mcpp 的 clang 编，所以必须先 build（且目标要与 tidy 同为 windows）
      - name: Build
        run: mcpp build

      - name: Run clang-tidy
        shell: bash
        run: sh scripts/run-tidy.sh

# 静态检查的第一层：构建时的编译器告警（见 mcpp.toml 的 -Wall -Wextra -Wpedantic -Wshadow）。
#
# **clang-tidy 的 job 加过，2026-10-05 又撤掉了** —— 试出来的结论记在这，免得再试一遍：
#
#   PyPI 的 `clang-tidy` wheel 里那个 clang **不是从 git 检出构建的官方版，没嵌 VCS 分支信息**。
#   而 mcpp 的真 clang 20.1.7 编出的 BMI 头部记着 commit hash，clang 读模块文件时会比对
#   「built from a different branch」—— 编译器那半边是空的，于是**每个文件都报**
#     module file '.../std.pcm' built from a different branch (…) than the compiler ()
#   31 个文件 31 个「有问题」，全是假的。
#
# 这与版本对齐无关（20.1.0 对 20.1.7 已经同 major.minor），是**构建来源**的差别。
# 本机 Windows 上却能正常读 —— 同一份 wheel，所以这大概是平台差异而非运气，
# 但反正 CI（Linux）上这条路过不去。
#
# 所以静态检查靠两层：
#   - 构建时的 -Wall -Wextra -Wpedantic -Wshadow：每次构建都在跑，挡住低级错误
#   - 本地 `sh scripts/run-tidy.sh`：能跑（读得了 BMI），比 CI 严得多。
#     它抓过一个真 UB —— `1 << (index - 1)` 里 `index == 0` 的判断写在移位之后，
#     size_t 回绕成 SIZE_MAX，那是未定义行为，bugprone/performance 都没报，只有
#     clang-analyzer-core.BitwiseShift 报了。`.clang-tidy` 里现在开着 clang-analyzer-*。
#
# 要在 CI 上恢复 tidy，得先有一个**从 git 检出构建**的 clang-tidy 20.1.x 可用。
