name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # mcpp-bin 的 wheel 覆盖 Linux x86_64/aarch64、macOS arm64 与 Windows x86_64，
      # 装上后 mcpp 直接进 PATH，比各平台各自的安装脚本省事也更稳。
      - name: Install mcpp
        run: pip install --upgrade mcpp-bin

      - name: mcpp version
        run: mcpp self version

      # -v：模块扫描阶段的问题（哪个文件提供哪个模块）只有 verbose 才看得到
      - name: Build
        run: mcpp build -v

      - name: Run tests
        run: mcpp test

  # Linux / macOS 跑 sh 版，Windows 跑 ps1 版，两边做完的事必须一致：
  # 产物进 releases/<程序名>/，pack 的暂存区 target/dist 清掉，构建缓存留着。
  packaging:
    name: packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mcpp
        run: pip install --upgrade mcpp-bin

      - name: 打包（Linux / macOS）
        if: runner.os != 'Windows'
        run: sh scripts/pack-releases.sh

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\pack-releases.ps1

      - name: 校验产物
        shell: bash
        run: |
          set -e
          echo "--- releases/simplify ---"
          ls -1 releases/simplify

          if [ -f "releases/simplify/simplify.exe" ]; then
            exe="releases/simplify/simplify.exe"
          else
            exe="releases/simplify/simplify"
          fi
          test -x "$exe" || { echo "产物不可执行: $exe"; exit 1; }

          # pack 的暂存区必须被清掉（产物已经复制到 releases，留着就是重复）
          if [ -e target/dist ]; then
            echo "FAIL: target/dist 还在，脚本没清理"
            exit 1
          fi
          echo "ok: target/dist 已清理"

          # 构建缓存要留着，删了下次就是全量重编
          test -d target || { echo "FAIL: target/ 构建缓存被误删"; exit 1; }
          echo "ok: target/ 构建缓存保留"

          echo "--- 跑一遍产物 ---"
          printf '2x + 3x\nx = 5\n0=0\n' | "$exe" | tee /tmp/out.txt
          grep -q '化简结果: 25' /tmp/out.txt || { echo "FAIL: 产物输出不对"; exit 1; }
          echo "ok: 产物运行正常"

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本需与本地开发环境一致，否则同一份代码会得出不同结论
      - name: Install clang-format
        run: pip install "clang-format==23.1.1"

      - name: Check formatting
        run: |
          files=$(find src tests apps -type f \( -name '*.cppm' -o -name '*.cpp' -o -name '*.hpp' \))
          clang-format --dry-run --Werror $files

  # 静态检查。与 format 一样只在 Linux 上跑，且**必须用与工具链同版本的 clang-tidy**。
  #
  # 曾经删掉过这个 job：mcpp 的 llvm 包是精简版、**不含 clang-tidy**，CI 上装不到，
  # 只能对着旧版 clang 的 BMI 刷出 "module file uses an older format" 之类的假错误。
  # 现在有办法了 —— PyPI 上的 `clang-tidy` wheel 自带可执行文件与资源目录，
  # 版本与 llvm@20.1.7 对齐（补丁号不同没关系，同 major.minor 就能读 BMI）。
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 60          # 28 个模块文件 × 约 1 分钟，留足余量
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mcpp
        run: pip install --upgrade mcpp-bin

      # 版本与工具链对齐：llvm@20.1.7 对应的 clang-tidy 就是 20.1.0（PyPI 上没有 20.1.7）。
      # ⚠️ 换 mcpp 的 llvm 版本时这里要一起换，否则读不了 BMI、满屏假错误。
      - name: Install clang-tidy
        run: pip install "clang-tidy==20.1.0"

      # tidy 读的是编译数据库，所以必须先 build 出 compile_commands.json 与 BMI
      - name: Build
        run: mcpp build

      # 不用传 CLANG_TIDY：脚本找不到时会自己从 Python 包里认 clang_tidy/data/bin/clang-tidy
      # （在 workflow 里塞一段「算 exe 路径」的 Python 一行式太脆，折行或引号一出错就很难查）
      #
      # 脚本里已经处理了「一个文件都没查到」的情况（直接非零退出）——
      # 拿「没检查」当「检查通过」是最糟的失败模式。
      - name: Run clang-tidy
        run: sh scripts/run-tidy.sh

# 说明：静态检查有两个层次，构建时的编译器告警与 clang-tidy 是互补的 ——
#   -Wall -Wextra -Wpedantic -Wshadow（见 mcpp.toml）：快，每次构建都在跑，但只看编译器自己会的
#   clang-tidy（见上面的 tidy job）：慢，读 BMI，能做跨过程的语义检查
# 两个都留着：前者挡低级错误，后者今天就抓到一个真 UB。
